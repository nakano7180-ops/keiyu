<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>総合燃料費シミュレーター | ㈱中野油業</title>
  <style>
    /* 外部通信を一切行わない完全独立CSS */
    * { box-sizing: border-box; }
    body { background-color: #f3f4f6; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: #1f2937; padding: 1rem; margin: 0; }
    @media (min-width: 768px) { body { padding: 2rem; } }
    
    .logo-font { font-family: "MS Gothic", "Hiragino Sans", "Courier New", monospace; }
    
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }

    .max-w-md { max-width: 28rem; margin-left: auto; margin-right: auto; }
    .bg-white { background-color: #ffffff; }
    .rounded-2xl { border-radius: 1rem; }
    .shadow-xl { box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); }
    .overflow-hidden { overflow: hidden; }
    .border { border-width: 1px; border-style: solid; }
    .border-gray-200 { border-color: #e5e7eb; }
    
    /* ヘッダー */
    .bg-gray-900 { background-color: #111827; }
    .p-6 { padding: 1.5rem; }
    .text-white { color: #ffffff; }
    .text-center { text-align: center; }
    .border-b-4 { border-bottom-width: 4px; }
    .border-red-600 { border-bottom-color: #dc2626; }
    
    .flex { display: flex; }
    .justify-center { justify-content: center; }
    .mb-3 { margin-bottom: 0.75rem; }
    .text-red-500 { color: #ef4444; }
    .text-2xl { font-size: 1.5rem; line-height: 2rem; }
    .font-bold { font-weight: 700; }
    .tracking-tight { letter-spacing: -0.025em; }
    .text-gray-400 { color: #9ca3af; }
    .mt-1 { margin-top: 0.25rem; }
    .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    
    .space-y-6 > * + * { margin-top: 1.5rem; }
    .space-y-4 > * + * { margin-top: 1rem; }
    .space-y-3 > * + * { margin-top: 0.75rem; }
    .space-y-2 > * + * { margin-top: 0.5rem; }
    
    /* タブ */
    .bg-gray-100 { background-color: #f3f4f6; }
    .rounded-xl { border-radius: 0.75rem; }
    .p-1 { padding: 0.25rem; }
    
    .tab-btn { border: 1px solid transparent; background: none; cursor: pointer; width: 100%; text-align: center; font-size: 0.825rem; padding-top: 0.625rem; padding-bottom: 0.625rem; transition: all 0.15s; }
    .tab-btn.active { background-color: #ffffff; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1); color: #dc2626; border-color: #e5e7eb; border-radius: 0.5rem; font-weight: 700; }
    .tab-btn.inactive { color: #6b7280; font-weight: 700; }
    .tab-btn.inactive:hover { color: #374151; }
    
    /* 入力エリア */
    .block { display: block; }
    .font-semibold { font-weight: 600; }
    .text-gray-700 { color: #374151; }
    .mb-1 { margin-bottom: 0.25rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .relative { position: relative; }
    
    .input-field { width: 100%; padding-left: 1rem; padding-right: 3rem; padding-top: 0.75rem; padding-bottom: 0.75rem; background-color: #f9fafb; border: 1px solid #d1d5db; border-radius: 0.75rem; font-size: 1.125rem; line-height: 1.75rem; font-weight: 500; outline: none; transition: all 0.15s; }
    .input-field:focus { border-color: #dc2626; box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.2); background-color: #ffffff; }
    .price-input-wrapper .input-field { padding-right: 4rem; }
    
    .absolute { position: absolute; }
    .right-4 { right: 1rem; }
    .top-1/2 { top: 50%; }
    .-translate-y-1/2 { transform: translateY(-50%); }
    .text-gray-500 { color: #6b7280; }
    .font-medium { font-weight: 500; }
    
    /* 容器選択エリア（グリッド型） */
    .p-4 { padding: 1rem; }
    .container-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .container-item { width: calc(50% - 0.25rem); position: relative; }
    .container-input { width: 100%; padding: 0.625rem 0.5rem 0.625rem 3rem; border: 1px solid #d1d5db; border-radius: 0.5rem; font-size: 1rem; font-weight: 600; color: #1f2937; outline: none; background: #ffffff; transition: all 0.15s; }
    .container-input:focus { border-color: #dc2626; box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.2); }
    .container-label { position: absolute; left: 0.5rem; top: 50%; transform: translateY(-50%); font-size: 0.875rem; font-weight: 700; color: #4b5563; }
    .container-unit { position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%); font-size: 0.75rem; color: #9ca3af; font-weight: bold; pointer-events: none;}
    .text-xs { font-size: 0.75rem; line-height: 1rem; }
    .mt-2 { margin-top: 0.5rem; }
    
    /* 計算結果セクション */
    .bg-gray-50 { background-color: #f9fafb; }
    .p-5 { padding: 1.25rem; }
    .mt-6 { margin-top: 1.5rem; }
    .shadow-sm { box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
    .items-center { align-items: center; }
    .gap-2 { gap: 0.5rem; }
    .mb-4 { margin-bottom: 1rem; }
    .text-gray-800 { color: #1f2937; }
    .text-lg { font-size: 1.125rem; line-height: 1.75rem; }
    .justify-between { justify-content: space-between; }
    .items-end { align-items: flex-end; }
    .border-b { border-bottom-width: 1px; border-bottom-style: solid; }
    .border-gray-300 { border-color: #d1d5db; }
    .pb-3 { padding-bottom: 0.75rem; }
    .text-gray-600 { color: #4b5563; }
    .text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
    .text-gray-900 { color: #111827; }
    .pt-2 { padding-top: 0.5rem; }
    
    .diesel-tax-box { background-color: #ffffff; padding: 0.5rem; border-radius: 0.5rem; border: 1px solid #e5e7eb; margin-top: 0.5rem; font-weight: 700; color: #1f2937; }
    .text-red-600 { color: #dc2626; }
    
    /* お釣り計算セクション */
    .bg-amber-50 { background-color: #fffbeb; }
    .border-amber-200 { border-color: #fde68a; }
    .mt-4 { margin-top: 1rem; }
    .text-amber-800 { color: #92400e; }
    
    .input-field-amber { background-color: #ffffff; border-color: #fcd34d; width: 100%; padding-left: 1rem; padding-right: 3rem; padding-top: 0.75rem; padding-bottom: 0.75rem; border-radius: 0.75rem; font-size: 1.125rem; line-height: 1.75rem; font-weight: 500; outline: none; transition: all 0.15s; }
    .input-field-amber:focus { border-color: #b45309; box-shadow: 0 0 0 2px rgba(180, 83, 9, 0.2); }
    
    .border-t { border-top-width: 1px; border-top-style: solid; }
    .pt-4 { padding-top: 1rem; }
    .text-amber-700 { color: #b45309; }
    
    /* 値下げ額アラート */
    .bg-red-50 { background-color: #fef2f2; }
    .border-red-100 { border-color: #fee2e2; }
    .gap-3 { gap: 0.75rem; }
    .shrink-0 { flex-shrink: 0; }
    .mt-0px5 { margin-top: 0.125rem; }
    .text-red-800 { color: #991b1b; }
    .font-black { font-weight: 900; }
    .text-red-700 { color: #b91c1c; }
    
    /* フッター */
    .mt-8 { margin-top: 2rem; }
    .bg-black { background-color: #000000; }
    .rounded-xl-footer { border-radius: 0.75rem; }
    .shadow-inner { box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06); }
    .border-gray-800 { border-color: #1f2937; }
    .flex-col { flex-direction: column; }
    .w-full { width: 100%; }
    .tracking-logo { letter-spacing: 0.1em; }
    .mx-0px5 { margin-left: 0.125rem; margin-right: 0.125rem; }
    .h-10 { height: 2.5rem; }
    .flex-grow { flex-grow: 1; }
    .border-t-3 { border-top-width: 3px; border-top-style: solid; }
    .border-white { border-top-color: #ffffff; }
    .mt-14px { margin-top: 14px; }
    .ml-2 { margin-left: 0.5rem; }
    .w-36px { width: 36px; }
    .h-full { height: 100%; }
    .drop-shadow-md { filter: drop-shadow(0 4px 3px rgba(0, 0, 0, 0.07)) drop-shadow(0 2px 2px rgba(0, 0, 0, 0.06)); }
    .text-footer-sub { color: #ffffff; font-size: 11px; letter-spacing: 0.25em; margin-top: 0.25rem; font-family: monospace; }
  </style>
</head>
<body>

  <div class="max-w-md bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-200">
    
    <div class="bg-gray-900 p-6 text-white text-center border-b-4 border-red-600">
      <div class="flex justify-center mb-3 text-red-500">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="22" x2="21" y2="22"></line><line x1="4" y1="9" x2="14" y2="9"></line><path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"></path><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 5"></path></svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight">総合燃料費シミュレーター</h1>
      <p class="text-gray-400 mt-1 text-sm font-mono">Ver. 2026 / ㈱中野油業</p>
    </div>

    <div class="p-6 space-y-6">
      
      <div class="flex bg-gray-100 rounded-xl p-1 border border-gray-200">
        <button id="tab-diesel" class="flex-1 rounded-lg transition-all tab-btn active" onclick="setFuel('diesel')">
          軽油 (免税)
        </button>
        <button id="tab-other" class="flex-1 rounded-lg transition-all tab-btn inactive" onclick="setFuel('other')">
          重油等
        </button>
        <button id="tab-kerosene" class="flex-1 rounded-lg transition-all tab-btn inactive" onclick="setFuel('kerosene')">
          灯油 (容器)
        </button>
      </div>

      <div class="space-y-4">
        
        <div id="poly-can-group" style="display: none;" class="p-4 bg-gray-100 rounded-xl border border-gray-200">
          <label class="block text-sm font-semibold text-gray-700 mb-2">容器の内訳 (個数/追加分)</label>
          <div class="container-grid">
            <div class="container-item">
              <span class="container-label">18L</span>
              <input type="number" id="can-18" class="container-input" value="1" step="0.5" min="0" oninput="calculateFromCan()" onfocus="this.select()">
              <span class="container-unit">缶</span>
            </div>
            <div class="container-item">
              <span class="container-label">20L</span>
              <input type="number" id="can-20" class="container-input" value="0" step="0.5" min="0" oninput="calculateFromCan()" onfocus="this.select()">
              <span class="container-unit">缶</span>
            </div>
            <div class="container-item">
              <span class="container-label">200L</span>
              <input type="number" id="can-200" class="container-input" value="0" step="0.5" min="0" oninput="calculateFromCan()" onfocus="this.select()">
              <span class="container-unit">本</span>
            </div>
            <div class="container-item">
              <span class="container-label">端数</span>
              <input type="number" id="can-fraction" class="container-input" value="0" step="0.1" min="0" oninput="calculateFromCan()" onfocus="this.select()">
              <span class="container-unit">L</span>
            </div>
          </div>
          <p class="text-xs text-gray-500 mt-2 font-medium">※入力した個数と端数が合算され、下の「給油量(L)」に自動反映されます。</p>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">給油量 (リットル)</label>
          <div class="relative">
            <input type="number" id="volume" class="input-field" value="50" step="0.1" placeholder="0" oninput="calculate()" onfocus="this.select()">
            <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 font-medium">L</span>
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">店頭表示単価 (税込)</label>
          <div class="relative price-input-wrapper">
            <input type="number" id="pricePerLiter" class="input-field" value="130" step="0.1" placeholder="0" oninput="calculate()" onfocus="this.select()">
            <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 font-medium">円/L</span>
          </div>
        </div>
      </div>

      <div class="bg-gray-50 rounded-xl p-5 border border-gray-200 mt-6 shadow-sm">
        <div class="flex items-center gap-2 mb-4 text-gray-800">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="16" y1="14" x2="16" y2="18"></line><path d="M16 10h.01"></path><path d="M12 10h.01"></path><path d="M8 10h.01"></path><path d="M12 14h.01"></path><path d="M8 14h.01"></path><path d="M12 18h.01"></path><path d="M8 18h.01"></path></svg>
          <h2 class="font-bold text-lg">計算結果</h2>
        </div>

        <div class="space-y-3">
          <div class="flex justify-between items-end border-b border-gray-300 pb-3">
            <span class="text-gray-600 font-medium">支払総額</span>
            <span id="total-amount" class="text-3xl font-bold text-gray-900">¥0</span>
          </div>

          <div class="space-y-2 pt-2 text-sm">
            <div class="flex justify-between items-center text-gray-600">
              <span>本体価格 (税抜)</span>
              <span id="base-price-total" class="font-medium">¥0</span>
            </div>
            <div class="flex justify-between items-center text-gray-600">
              <span>消費税 (10%)</span>
              <span id="consumption-tax-total" class="font-medium">¥0</span>
            </div>
            
            <div id="diesel-tax-row" class="flex justify-between items-center diesel-tax-box">
              <span>軽油引取税 (15円/L)</span>
              <span id="diesel-tax" class="text-red-600">¥0</span>
            </div>
          </div>
        </div>
      </div>

      <div class="bg-amber-50 rounded-xl p-5 border border-amber-200 mt-4 shadow-sm">
        <div class="flex items-center gap-2 mb-4 text-amber-800">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2"></circle><path d="M6 12h.01M18 12h.01"></path></svg>
          <h2 class="font-bold text-lg">お会計・お釣り計算</h2>
        </div>
        
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">お預かり金額</label>
            <div class="relative">
              <input type="number" id="receivedAmount" class="input-field-amber" placeholder="お客様からのお預かり額を入力" oninput="calculate()" onfocus="this.select()">
              <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 font-medium">円</span>
            </div>
          </div>

          <div class="flex justify-between items-end border-t border-amber-200 pt-4 mt-2">
            <span class="text-gray-700 font-bold">お釣り</span>
            <span id="change-amount" class="text-3xl font-bold text-amber-700">¥0</span>
          </div>
        </div>
      </div>

      <div id="diesel-alert" class="bg-red-50 rounded-xl p-4 border border-red-100 flex gap-3 mt-6">
        <div class="text-red-600 shrink-0 mt-0px5">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"></polyline><polyline points="16 17 22 17 22 11"></polyline></svg>
        </div>
        <div>
          <p class="text-sm text-red-800 font-bold">暫定税率時代からの値下げ額</p>
          <p id="saved-amount" class="text-2xl font-black text-red-600 mt-1">-¥0</p>
          <p class="text-xs text-red-700 mt-1">※旧税率32.1円/Lで計算した場合との差額</p>
        </div>
      </div>

      <div class="mt-8 bg-black p-6 rounded-xl-footer flex flex-col items-center justify-center w-full overflow-hidden shadow-inner border border-gray-800">
        <div class="flex items-center text-3xl font-black tracking-logo mb-1 logo-font">
          <span class="text-white">㈱中野</span>
          <span class="text-[#ff0000] mx-0px5">油</span>
          <span class="text-white">業</span>
        </div>
        
        <div class="w-full relative flex items-start h-10 mt-1 mb-1">
          <div class="flex-grow border-t-3 border-white mt-14px ml-2"></div>
          <div class="w-36px h-full relative shrink-0">
            <svg viewBox="0 0 40 40" class="w-full h-full drop-shadow-md">
              <line x1="0" y1="14" x2="8" y2="22" stroke="white" stroke-width="3" />
              <rect x="8" y="19" width="12" height="15" stroke="white" stroke-width="3" fill="transparent" rx="1" />
              <path d="M 20,22 C 26,22 28,24 28,26.5 C 28,29 26,31 20,31" stroke="white" stroke-width="2.5" fill="transparent" />
              <line x1="8" y1="34" x2="3" y2="40" stroke="white" stroke-width="2.5" stroke-linecap="round" />
            </svg>
          </div>
        </div>

        <div class="text-footer-sub">
          NAKANO YUGYO corp.
        </div>
      </div>

    </div>
  </div>

  <script>
    let fuelType = 'diesel';

    function setFuel(type) {
      fuelType = type;
      const btnDiesel = document.getElementById('tab-diesel');
      const btnOther = document.getElementById('tab-other');
      const btnKerosene = document.getElementById('tab-kerosene');
      const priceInput = document.getElementById('pricePerLiter');
      const dieselTaxRow = document.getElementById('diesel-tax-row');
      const dieselAlert = document.getElementById('diesel-alert');
      const polyCanGroup = document.getElementById('poly-can-group');
      const volumeInput = document.getElementById('volume');

      btnDiesel.className = 'flex-1 rounded-lg transition-all tab-btn inactive';
      btnOther.className = 'flex-1 rounded-lg transition-all tab-btn inactive';
      btnKerosene.className = 'flex-1 rounded-lg transition-all tab-btn inactive';

      if (type === 'diesel') {
        btnDiesel.className = 'flex-1 rounded-lg transition-all tab-btn active';
        priceInput.value = '130';
        dieselTaxRow.style.display = 'flex';
        dieselAlert.style.display = 'flex';
        polyCanGroup.style.display = 'none';
      } else if (type === 'other') {
        btnOther.className = 'flex-1 rounded-lg transition-all tab-btn active';
        priceInput.value = '160';
        dieselTaxRow.style.display = 'none';
        dieselAlert.style.display = 'none';
        polyCanGroup.style.display = 'none';
      } else if (type === 'kerosene') {
        btnKerosene.className = 'flex-1 rounded-lg transition-all tab-btn active';
        priceInput.value = '110';
        dieselTaxRow.style.display = 'none';
        dieselAlert.style.display = 'none';
        polyCanGroup.style.display = 'block';
        
        // 灯油タブを開いた時の初期化
        document.getElementById('can-18').value = '1';
        document.getElementById('can-20').value = '0';
        document.getElementById('can-200').value = '0';
        document.getElementById('can-fraction').value = '0';
        volumeInput.value = '18';
      }
      calculate();
    }

    function calculateFromCan() {
      // 各容器の個数を取得。未入力・文字の場合は0として扱う
      const c18 = parseFloat(document.getElementById('can-18').value) || 0;
      const c20 = parseFloat(document.getElementById('can-20').value) || 0;
      const c200 = parseFloat(document.getElementById('can-200').value) || 0;
      const frac  = parseFloat(document.getElementById('can-fraction').value) || 0;
      
      // 合算計算（端数のズレを防ぐため小数第1位で丸める）
      const totalVolume = Math.round(((c18 * 18) + (c20 * 20) + (c200 * 200) + frac) * 10) / 10;
      document.getElementById('volume').value = totalVolume.toString();
      
      calculate();
    }

    function calculate() {
      const volume = parseFloat(document.getElementById('volume').value);
      const pricePerLiter = parseFloat(document.getElementById('pricePerLiter').value);
      const receivedAmountStr = document.getElementById('receivedAmount').value;
      const receivedAmount = parseInt(receivedAmountStr, 10);

      const totalAmountEl = document.getElementById('total-amount');
      const basePriceTotalEl = document.getElementById('base-price-total');
      const consumptionTaxTotalEl = document.getElementById('consumption-tax-total');
      const dieselTaxEl = document.getElementById('diesel-tax');
      const savedAmountEl = document.getElementById('saved-amount');
      const changeAmountEl = document.getElementById('change-amount');

      if (isNaN(volume) || isNaN(pricePerLiter) || volume <= 0 || pricePerLiter <= 0) {
        totalAmountEl.innerText = '¥0';
        basePriceTotalEl.innerText = '¥0';
        consumptionTaxTotalEl.innerText = '¥0';
        dieselTaxEl.innerText = '¥0';
        savedAmountEl.innerText = '-¥0';
        changeAmountEl.innerText = '¥0';
        return;
      }

      const totalAmount = pricePerLiter * volume;
      const roundedTotal = Math.round(totalAmount);
      totalAmountEl.innerText = '¥' + roundedTotal.toLocaleString();

      let basePriceTotal = 0;
      let consumptionTaxTotal = 0;
      let taxAmount = 0;
      let savedAmount = 0;

      if (fuelType === 'diesel') {
        taxAmount = volume * 15.0;
        const basePricePerLiter = (pricePerLiter - 15.0) / 1.10;
        basePriceTotal = basePricePerLiter * volume;
        consumptionTaxTotal = basePriceTotal * 0.10;
        savedAmount = (32.1 - 15.0) * volume;

        dieselTaxEl.innerText = '¥' + Math.round(taxAmount).toLocaleString();
        savedAmountEl.innerText = '-¥' + Math.round(savedAmount).toLocaleString();
      } else {
        basePriceTotal = totalAmount / 1.10;
        consumptionTaxTotal = totalAmount - basePriceTotal;
      }

      basePriceTotalEl.innerText = '¥' + Math.round(basePriceTotal).toLocaleString();
      consumptionTaxTotalEl.innerText = '¥' + Math.round(consumptionTaxTotal).toLocaleString();

      // お釣り計算ロジック
      if (receivedAmountStr === '' || isNaN(receivedAmount)) {
        changeAmountEl.innerText = '¥0';
        changeAmountEl.style.color = '#b45309';
      } else {
        const changeAmount = receivedAmount - roundedTotal;
        if (changeAmount < 0) {
          changeAmountEl.innerText = '不足 ¥' + Math.abs(changeAmount).toLocaleString();
          changeAmountEl.style.color = '#dc2626';
        } else {
          changeAmountEl.innerText = '¥' + changeAmount.toLocaleString();
          changeAmountEl.style.color = '#b45309';
        }
      }
    }

    // 初回計算実行
    calculate();
  </script>
</body>
</html>
